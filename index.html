<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Pixel</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="arcade">
    <header class="game-heading">
      <span class="eyebrow">★ MINI ARCADE ★</span>
      <h1>FLAPPY <span>PIXEL</span></h1>
      <p>THE 8-BIT SKY ADVENTURE</p>
    </header>

    <div class="game-frame">
      <div class="game-screen">
        <canvas id="gameCanvas" width="400" height="600"
          aria-label="Flappy Pixel game. Press Space, Up Arrow, or tap to flap."></canvas>
        <div class="hud" aria-live="polite">
          <div class="counter"><span>SCORE</span><strong id="score">0</strong></div>
          <div class="counter best"><span>BEST</span><strong id="highScore">0</strong></div>
        </div>
        <div class="scanlines" aria-hidden="true"></div>
      </div>
    </div>

    <div class="controls">
      <button id="restartButton" type="button">↻ RESTART GAME</button>
      <p>PRESS <kbd>SPACE</kbd> / <kbd>↑</kbd> OR TAP TO FLAP</p>
      <small>High score is saved in this browser.</small>
    </div>
  </main>
</body>
</html>
